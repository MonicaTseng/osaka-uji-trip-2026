<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大阪・宇治每日行程介紹｜2026</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f6f8fb;color:#213244;line-height:1.7}a{color:#1769aa}.wrap{width:min(1040px,calc(100% - 24px));margin:auto}.hero{padding:46px 0 34px;background:linear-gradient(135deg,#e8f2ff,#fff7e8)}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.08;margin:.25em 0;color:#173b63}h2,h3{color:#173b63}.tag{display:inline-block;background:#fff;border:1px solid #dce6ef;border-radius:999px;padding:5px 11px;margin:4px 4px 0 0}.days{display:grid;gap:18px;padding:28px 0}.day{background:#fff;border:1px solid #dce6ef;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #2030400b}.head{padding:18px 20px;background:#eef6ff;border-bottom:1px solid #dce6ef}.head b{font-size:.9rem;color:#58708a}.head h2{margin:3px 0}.body{padding:18px 20px}.route{font-weight:800;margin-bottom:10px}.timeline{border-left:3px solid #bdd5ea;padding-left:18px}.stop{position:relative;margin:0 0 16px}.stop:before{content:"";position:absolute;left:-25px;top:8px;width:11px;height:11px;border-radius:50%;background:#2c79b9;border:3px solid #fff;box-shadow:0 0 0 1px #9dbbd4}.time{font-size:.82rem;font-weight:800;color:#6a7684}.stop h3{margin:2px 0 0;font-size:1.05rem}.stop p{margin:2px 0;color:#5a6876}.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.tip{background:#f5f8fb;border-radius:12px;padding:10px 12px;font-size:.9rem}.tip.warn{background:#fff4e8}.map{display:inline-block;margin-top:5px;text-decoration:none;font-weight:800;font-size:.83rem;background:#e9f3ff;padding:4px 9px;border-radius:999px}.toplink{display:inline-block;margin-top:12px;text-decoration:none;font-weight:800}.footer{text-align:center;padding:28px;color:#687684}@media(max-width:700px){.tips{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><div>2026.08.09–08.14｜大阪・宇治6天5夜</div><h1>每日行程介紹</h1><p>依照每天主題，快速知道怎麼走、看什麼、哪裡可彈性刪減，以及當天最重要的提醒。</p><span class="tag">長者友善</span><span class="tag">大眾運輸</span><span class="tag">每日導航</span><span class="tag">購物提醒</span><br><a class="toplink" href="index.html">← 返回完整旅遊手冊</a></div></header><main class="wrap"><section class="days" id="days"></section></main><footer class="footer">大阪・宇治自由行｜每日行程介紹頁</footer><script>const days=[{d:'DAY1｜8/9',t:'抵達大阪：神社、關東煮、道頓堀',r:'神戶機場T2→Port Liner→三宮→阪神→大阪難波→Metro→大國町',s:[['08:15–11:45','桃園T1→神戶機場T2','入境、領行李後前往神戶空港站','Kobe Airport Terminal 2'],['約13:00–16:00','前往大國町飯店','三宮轉阪神至大阪難波，再轉Metro','Hotel Sobial Namba Daikokucho'],['16:25–16:55','難波八阪神社','看巨大獅子殿；班機延誤時可取消','難波八阪神社'],['17:20–18:30','たこ梅本店','大阪老字號關東煮','たこ梅本店'],['18:30–20:00','道頓堀散步','先看招牌與河岸，遊船留到Day2','道頓堀 グリコサイン'],['20:10後','Super玉出惠美須店','補飲料、早餐與日用品','スーパー玉出 恵美須店']],tip:['第一天不排太滿','神社是首要刪除點','阿嬤只走核心河岸','行動電源不能託運']},{d:'DAY2｜8/10',t:'大阪周遊卡日：市場、大阪城、兩段遊船',r:'大國町→木津市場→道頓堀換票→森之宮→大阪城→心齋橋',s:[['07:00–07:40','飯店早餐','住宿已含早餐','Hotel Sobial Namba Daikokucho'],['08:00–09:00','木津市場','從大國町1號出口前往','大阪木津卸売市場'],['09:20–09:40','先換晚間遊船票','指定晚間班次，避免傍晚售罄','とんぼりリバークルーズ チケット売り場'],['10:30–11:30','鰻魚處美味美UMAMI','森之宮附近午餐','鰻魚處 美味美 UMAMI 森之宮'],['11:40–13:10','大阪城天守閣＋豐臣石垣館','周遊卡適用，城區很大','大阪城天守閣'],['13:20–14:00','大阪城御座船','需現場換指定班次','大阪城御座船 乗り場'],['18:00–19:00','北極星心齋橋本店','蛋包飯晚餐','北極星 心斎橋本店'],['19:30或20:00','道頓堀水上觀光船','提前15分鐘抵達','とんぼりリバークルーズ 乗り場']],tip:['今天主要用大阪周遊卡','上午先換晚間船票','大阪城安排坐下休息','晚上回住宿可洗衣']},{d:'DAY3｜8/11',t:'池田與心齋橋：杯麵、Funko、入住Airbnb',r:'退房寄行李→池田→心齋橋→取行李→Airbnb',s:[['早餐後','退房並寄放行李','先留在原飯店','Hotel Sobial Namba Daikokucho'],['09:30–11:45','日清杯麵博物館大阪池田','入館免費；自製杯麵另付費','カップヌードルミュージアム 大阪池田'],['11:50–12:50','池田午餐','觀光案內所周邊優先','池田市観光案内所'],['13:00–14:00','池田城跡公園','天氣炎熱或阿嬤累就取消','池田城跡公園'],['15:15–16:15','Bobbing World','找Funko公仔，記得買保護盒','Bobbing World Osaka'],['16:15–17:40','心齋橋＋PABLO','依體力縮短停留','PABLO 心斎橋本店'],['18:00後','取行李並入住Airbnb','以房東最新定位為準','パルステージ難波南']],tip:['Cup Noodles Museum這天有開','Funko建議手提不託運','池田城跡是彈性景點','晚上可選HARUKAS 300']},{d:'DAY4｜8/12',t:'宇治一日：平等院、抹茶、神社',r:'大阪→宇治→平等院→表參道→宇治上神社→大阪',s:[['早上','便利商店早餐後出發','避開中午最熱時段','Uji Station'],['上午','平等院庭園＋鳳翔館','門票700日圓；鳳凰堂內部另加300日圓','平等院'],['中午','平等院表參道午餐','保留用餐與休息時間','Byodoin Omotesando'],['午後','辻利買伴手禮','抹茶、茶點與常溫伴手禮','辻利 宇治本店'],['彈性','宇治上神社','免費；依阿嬤體力決定','宇治上神社'],['下午','伊藤久右衛門甜點','安排坐下休息','伊藤久右衛門 宇治本店'],['晚上','LIFE大國町採買','從大國町站2號出口較方便','ライフ大国町店']],tip:['宇治以平等院為核心','神社可視體力取消','抹茶甜點不要排太密','晚上回住宿可洗衣']},{d:'DAY5｜8/13',t:'市場與門真購物：Costco、LaLaport、Outlet',r:'黑門市場→心齋橋→付費接駁巴士→門真商場群',s:[['上午','黑門市場','吃小份量，避免太早買需冷藏物','黒門市場'],['上午後段','心齋橋短逛','預留搭接駁車時間','Shinsaibashi Station'],['中午前後','搭付費接駁巴士','心齋橋→LaLaport門真；單程500日圓、只收現金','三井ショッピングパーク ららぽーと門真'],['下午','Costco門真','帶會員卡；大件商品先評估行李重量','Costco Wholesale Kadoma'],['下午至晚間','LaLaport＋三井Outlet','三區集中，可依體力分流逛','三井アウトレットパーク 大阪門真']],tip:['4人來回接駁共4,000日圓現金','Costco會員卡要帶','大型購物優先刷卡','回程行李每件控制21～22公斤']},{d:'DAY6｜8/14',t:'返程：大阪→神戶機場→桃園',r:'Airbnb→大阪難波→阪神→三宮→Port Liner→神戶機場T2',s:[['早上','退房前最後檢查','護照、錢包、充電器、藥品與冰箱','パルステージ難波南'],['建議提早','前往神戶機場','預留轉乘與搬行李時間','Kobe Airport Terminal 2'],['12:45–14:45','神戶T2→桃園T1','託運每人1件、每件23公斤；手提1件7公斤','Taiwan Taoyuan International Airport Terminal 1']],tip:['至少提前2小時到機場','液體與大型購物放託運','行動電源放手提','Funko用保護盒並盡量手提']}];const root=document.querySelector('#days');days.forEach(x=>{const e=document.createElement('article');e.className='day';e.innerHTML=`<div class="head"><b>${x.d}</b><h2>${x.t}</h2></div><div class="body"><div class="route">🚆 ${x.r}</div><div class="timeline">${x.s.map(v=>`<div class="stop"><div class="time">${v[0]}</div><h3>${v[1]}</h3><p>${v[2]}</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v[3])}">Google地圖</a></div>`).join('')}</div><div class="tips">${x.tip.map((v,i)=>`<div class="tip ${i==1?'warn':''}">💡 ${v}</div>`).join('')}</div></div>`;root.appendChild(e)});</script></body></html>
